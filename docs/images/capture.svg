<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 20px; font-weight: 700; fill: #3B3654; }
    .head { font-size: 15px; font-weight: 700; fill: #3B3654; }
    .body { font-size: 13px; fill: #3B3654; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; font-weight: 700; fill: #3B3654; }
    .note { font-size: 12.5px; fill: #6E6786; }
    .tag { font-size: 11.5px; fill: #5B4BA6; }
    .num { font-size: 12px; font-weight: 700; fill: #FFFDF9; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8E7CC3"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="600" rx="18" fill="#FDF6EC"/>
  <text class="title" x="32" y="44">How every iteration is captured</text>
  <text class="note" x="32" y="66">Hooks only say "something happened". The daemon reads the content from the session transcript, once per line.</text>

  <!-- Claude Code -->
  <rect x="32" y="92" width="236" height="150" rx="14" fill="#FFFDF9" stroke="#D9D1F2" stroke-width="2"/>
  <text class="head" x="50" y="120">Claude Code session</text>
  <text class="note" x="50" y="144">writes the transcript</text>
  <text class="mono" x="50" y="162">~/.claude/projects/</text>
  <text class="mono" x="50" y="178">  &lt;folder&gt;/&lt;session&gt;.jsonl</text>
  <text class="note" x="50" y="206">fires hooks after each tool</text>
  <text class="note" x="50" y="223">batch and when a turn ends</text>

  <!-- hook client -->
  <rect x="320" y="92" width="236" height="150" rx="14" fill="#FFFDF9" stroke="#D9D1F2" stroke-width="2"/>
  <text class="mono" x="338" y="120">hippo hook &lt;event&gt;</text>
  <text class="note" x="338" y="144">async: never slows the session</text>
  <text class="note" x="338" y="166">sends session id, transcript path</text>
  <text class="note" x="338" y="183">and prompt id to the daemon</text>
  <text class="note" x="338" y="211">starts the daemon if it is not</text>
  <text class="note" x="338" y="228">running yet</text>

  <path d="M268 167 L318 167" stroke="#8E7CC3" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="tag" x="50" y="266">hooks: PostToolBatch · Stop · StopFailure · SessionEnd</text>

  <!-- fallback -->
  <rect x="320" y="296" width="236" height="96" rx="12" fill="#FBE9DC"/>
  <text class="head" x="338" y="322">Daemon cannot start?</text>
  <text class="note" x="338" y="344">the request goes to</text>
  <text class="mono" x="338" y="362">spool/pending.jsonl</text>
  <text class="note" x="338" y="381">and is processed at the next start</text>
  <path d="M438 244 L438 294" stroke="#E0A27C" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>

  <!-- import -->
  <rect x="32" y="420" width="524" height="88" rx="12" fill="#EFE8F7"/>
  <text class="mono" x="50" y="448">hippo import --from &lt;old path&gt; --to &lt;project&gt;</text>
  <text class="note" x="50" y="470">brings in past sessions that were recorded before the hooks were installed,</text>
  <text class="note" x="50" y="488">one session per request, behind live work</text>

  <!-- daemon -->
  <rect x="604" y="92" width="324" height="476" rx="14" fill="#FFFDF9" stroke="#8E7CC3" stroke-width="2"/>
  <text class="mono" x="622" y="120">hippo daemon</text>
  <text class="note" x="736" y="120">one per machine</text>

  <path d="M556 167 L602 167" stroke="#8E7CC3" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="tag" x="560" y="158">socket</text>
  <path d="M556 344 C 580 344, 580 200, 602 200" fill="none" stroke="#E0A27C" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <path d="M556 464 C 584 464, 584 230, 602 230" fill="none" stroke="#8E7CC3" stroke-width="2" marker-end="url(#arrow)"/>

  <circle cx="632" cy="156" r="11" fill="#8E7CC3"/><text class="num" x="628" y="160">1</text>
  <text class="head" x="652" y="161">Writer thread</text>
  <text class="note" x="652" y="182">reads new lines from the saved offset</text>
  <text class="note" x="652" y="200">stores iterations and tool results</text>
  <text class="note" x="652" y="218">in one SQLite transaction</text>
  <text class="note" x="652" y="236">and adds embed_jobs</text>

  <circle cx="632" cy="276" r="11" fill="#8E7CC3"/><text class="num" x="628" y="280">2</text>
  <text class="head" x="652" y="281">Embedding queue</text>
  <rect x="652" y="294" width="74" height="26" rx="13" fill="#D9D1F2"/>
  <text class="body" x="672" y="312">live</text>
  <rect x="736" y="294" width="86" height="26" rx="13" fill="#EFE8F7"/>
  <text class="body" x="755" y="312">import</text>
  <text class="note" x="652" y="340">live work goes first</text>

  <circle cx="632" cy="380" r="11" fill="#8E7CC3"/><text class="num" x="628" y="384">3</text>
  <text class="head" x="652" y="385">Embedding thread</text>
  <text class="note" x="652" y="406">batches of up to 64 jobs</text>
  <text class="note" x="652" y="424">→ local Ollama embedding model</text>
  <text class="note" x="652" y="442">→ LanceDB, one write per batch</text>

  <rect x="622" y="470" width="288" height="80" rx="10" fill="#FDF6EC"/>
  <text class="tag" x="636" y="494">Prompt injection and deletes go first:</text>
  <text class="tag" x="636" y="512">the embedding thread steps aside for them</text>
  <text class="tag" x="636" y="530">between its embedding calls.</text>
</svg>
