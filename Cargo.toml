[package]
name = "smem"
version = "0.1.0"
edition = "2024"

[dependencies]
arrow-array = "58.4.1"
arrow-schema = "58.4.1"
clap = { version = "4.6.7", features = ["derive"] }
futures = "0.3.34"
lancedb = "0.41.0"
libc = "0.2.191"
regex = "1.13.1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }
toml = "1.1.8"
ureq = { version = "3.5.0", features = ["json"] }

[dev-dependencies]
tempfile = "3.27.0"
