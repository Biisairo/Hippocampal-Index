[package]
name = "hippo"
version = "0.0.2"
description = "Hippocampal Index: long-term memory for Claude Code sessions"
edition = "2024"
license = "MIT"

[dependencies]
arrow-array = "58.4.1"
arrow-schema = "58.4.1"
brush-parser = "0.4"
clap = { version = "4.6.7", features = ["derive"] }
eframe = "0.37"
egui_extras = "0.37"
egui_commonmark = { version = "0.26", default-features = false, features = ["pulldown_cmark"] }
futures = "0.3.34"
lancedb = "0.41.0"
libc = "0.2.191"
regex = "1.13.1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
similar = "3.2.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }
toml = "1.1.8"
toml_edit = "0.25.17"
ureq = { version = "3.5.0", features = ["json"] }

[dev-dependencies]
tempfile = "3.27.0"
